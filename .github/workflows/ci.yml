name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Build (tsc, strict)
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Demo (brain-mcp over stdio on the sample wiki)
        run: npm run demo

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/imessage/requirements.txt
      # Only what the tested modules import; wechat's pilk has no Linux wheel.
      - run: pip install -r packages/imessage/requirements.txt
      - name: Compile every Python server
        run: python -m compileall -q packages/imessage packages/linkedin packages/telegram packages/wechat packages/xiaohongshu
      - name: imessage tests
        working-directory: packages/imessage
        run: python -m unittest test_mcp_server -v
      - name: wechat OCR tests
        working-directory: packages/wechat
        run: python -m unittest test_wechat_ocr -v
